# ===============================
#   Murder Mystery – Einstellungen
# ===============================
# Farbcodes mit & (z. B. &c = rot, &a = grün, &7 = grau).
# Nach Änderungen: /mm reload

# Spieler treten beim Betreten des Servers automatisch der Lobby bei.
auto-join: true

# Mindestens so viele Spieler, damit der Countdown startet.
min-players: 4
# Maximale Spieleranzahl pro Runde (weitere Spieler schauen zu).
max-players: 16

# Lobby-Countdown in Sekunden (wird auf 10 verkürzt, wenn die Runde voll ist).
lobby-countdown: 30
# Sekunden nach Rundenstart, bevor Mörder/Detektiv ihre Waffen bekommen.
grace-period: 10
# Rundendauer in Sekunden. Läuft die Zeit ab, gewinnen die Unschuldigen.
game-duration: 270

# Text in der letzten Zeile des Scoreboards.
server-name: "&edein-server.de"

lobby:
  # Die Lobby darf in derselben Welt wie die Map liegen.
  # Entfernt sich ein wartender Spieler weiter als so viele Blöcke von der Lobby,
  # wird er zurückteleportiert (damit niemand vor Rundenstart auf die Map läuft). 0 = aus.
  max-distance: 40

# Weitere Einstellungen: roles.yml, gold.yml, gold-rewards.yml, database.yml – Maps: maps.yml

# Die allgemeine Wartelobby für alle Maps. Wird per /mm setlobby gesetzt.
arena:
  lobby: ""
